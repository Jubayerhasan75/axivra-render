name: Axivra render

on:
  repository_dispatch:
    types: [axivra-render]
  workflow_dispatch:
    inputs:
      payload:
        description: "Test job JSON, e.g. {\"job_id\":\"test1\",\"kind\":\"reel\",\"voice_lang\":\"EN\",\"scenes\":[{\"narration\":\"Hello from Axivra\",\"caption\":\"Hello\",\"image_prompt\":\"a friendly robot in a bright office\"}]}"
        required: true

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core > /dev/null
          ffmpeg -hide_banner -version | head -n 1

      - name: Build assets and render video
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python3 scripts/axivra_job.py

      - name: Upload video to the "renders" release
        id: upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STATUS=$(jq -r '.status' result.json)
          if [ "$STATUS" != "done" ]; then
            echo "Render failed, nothing to upload"
            exit 0
          fi
          FILE=$(jq -r '.file' result.json)
          NAME=$(jq -r '.name' result.json)
          gh release view renders > /dev/null 2>&1 || gh release create renders --title "Rendered media" --notes "Videos rendered for n8n. Old files are deleted automatically after 48 hours."
          if gh release upload renders "$FILE" --clobber; then
            URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/renders/${NAME}"
            jq --arg url "$URL" '. + {video_url: $url}' result.json > result2.json && mv result2.json result.json
          else
            jq '. + {status: "failed", error: "Could not upload the video to the GitHub release"}' result.json > result2.json && mv result2.json result.json
          fi

      - name: Report back to n8n
        if: always()
        env:
          N8N_CALLBACK_URL: ${{ secrets.N8N_CALLBACK_URL }}
          N8N_CALLBACK_SECRET: ${{ secrets.N8N_CALLBACK_SECRET }}
        run: |
          if [ ! -f result.json ]; then
            JOB=$(jq -r '.client_payload.job_id // .inputs.payload // "unknown"' "$GITHUB_EVENT_PATH" | head -c 80)
            echo "{\"status\":\"failed\",\"job_id\":\"$JOB\",\"error\":\"The render step crashed before writing a result\"}" > result.json
          fi
          BODY=$(jq -c --arg run "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" '. + {run_url: $run} | del(.file, .output)' result.json)
          echo "$BODY"
          curl -sS --fail --retry 3 --retry-delay 5 -X POST "$N8N_CALLBACK_URL" \
            -H "Content-Type: application/json" \
            -H "X-Axivra-Secret: $N8N_CALLBACK_SECRET" \
            -d "$BODY"
